name: Package validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=peer --ignore-scripts
      - run: npm run check:package
      - name: Check committed JavaScript syntax
        run: |
          for file in dist/*.js scripts/*.mjs; do node --check "$file"; done
